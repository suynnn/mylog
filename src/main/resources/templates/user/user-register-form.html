<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CSS (optional) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Bootstrap JavaScript Bundle (Popper included) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <link th:href="@{/css/user-register-form.css}" rel="stylesheet" />
    <link th:href="@{/css/fragment/navbar-fragment.css}" rel="stylesheet" />

    <script th:src="@{/js/user-register-form.js}"></script>
</head>
<body>
<div th:replace="~{/fragment/navbar-fragment :: navbarFragment}"></div>

<div class="container">
    <h1 class="mt-5 mb-4">회원 가입</h1>
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <form method="post" th:action="@{/users/register}" th:object="${userRegisterDto}" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label">아이디</label>
                    <div class="input-group">
                        <input type="text" id="username" th:field="*{username}" class="form-control" required>
                        <button type="button" id="check-username" class="btn btn-outline-secondary">아이디 중복 여부</button>
                        <button type="button" id="reset-username" class="btn btn-outline-secondary d-none">다시 입력하기</button>
                    </div>
                    <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                    <div id="username-feedback" class="form-text"></div>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">패스워드</label>
                    <input type="password" id="password" th:field="*{password}" class="form-control" required>
                    <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>
                <div class="mb-3">
                    <label for="password-check" class="form-label">패스워드 확인</label>
                    <input type="password" id="password-check" class="form-control" required>
                    <div id="password-feedback" class="form-text text-danger"></div>
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">이름</label>
                    <input type="text" id="name" th:field="*{name}" class="form-control" required>
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">이메일</label>
                    <div class="input-group">
                        <input type="text" id="email" th:field="*{email}" class="form-control" required>
                        <button type="button" id="check-email" class="btn btn-outline-secondary">이메일 중복 여부</button>
                        <button type="button" id="reset-email" class="btn btn-outline-secondary d-none">다시 입력하기</button>
                    </div>
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    <div id="email-feedback" class="form-text"></div>
                </div>
                <div class="mb-3">
                    <label for="nickname" class="form-label">닉네임</label>
                    <input type="text" id="nickname" th:field="*{nickname}" class="form-control" required>
                    <div th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></div>
                </div>
                <button type="submit" id="register-button" class="btn btn-primary" disabled>가입하기</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
