<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>유저 정보 업데이트</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CSS (optional) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Bootstrap JavaScript Bundle (Popper included) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <link th:href="@{/css/user-update-form.css}" rel="stylesheet" />
    <link th:href="@{/css/fragment/navbar-fragment.css}" rel="stylesheet" />

    <script th:src="@{/js/user-update-form.js}"></script>
</head>
<body>
<div th:replace="~{/fragment/navbar-fragment :: navbarFragment}"></div>

<main class="mt-5">
    <div>
        <h1>내 정보 수정</h1>
        <div>
            <form method="post" th:action="@{/users/update}" th:object="${userUpdateDto}">
                <div>
                    <input type="hidden" name="id" th:value="${#authentication.principal.getUserId()}" />
                    <input type="hidden" name="password" th:value="*{password}">
                    <input type="hidden" name="createdAt" th:value="*{createdAt}">
                    <input type="hidden" name="isWithdrawal" th:value="*{isWithdrawal}">
                </div>

                <div class="mb-3">
                    <label for="username" class="form-label">아이디</label>
                    <input type="text" id="username" th:field="*{username}" class="readonly form-control" readonly>
                    <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
                </div>
                <div class="mb-3">
                    <label for="passwordBtn" class="form-label">비밀 번호</label><br/>
                    <button type="button" id="passwordBtn" class="btn btn-outline-secondary">비밀번호 변경</button>
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">이름</label>
                    <input type="text" id="name" th:field="*{name}" class="readonly form-control" readonly>
                    <div th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">이메일</label>
                    <input type="text" id="email" th:field="*{email}" class="form-control" required>
                    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="mb-3">
                    <label for="nickname" class="form-label">닉네임</label>
                    <input type="text" id="nickname" th:field="*{nickname}" class="form-control" required>
                    <div th:if="${#fields.hasErrors('nickname')}" th:errors="*{nickname}"></div>
                </div>
                <button type="submit" class="btn btn-primary">정보 수정하기</button>
            </form>
        </div>
        <div class="mt-3 text-end">
            <button class="btn btn-danger" id="withdrawBtn">회원 탈퇴</button>
        </div>
    </div>
</main>

<!-- 비밀번호 변경 모달 -->
<div class="modal fade" id="passwordModal" tabindex="-1" aria-labelledby="passwordModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="passwordModalLabel">비밀번호 변경</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="newPassword" class="form-label">새 비밀번호</label>
                    <input type="password" id="newPassword" class="form-control">
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">새 비밀번호 확인</label>
                    <input type="password" id="confirmPassword" class="form-control">
                </div>
                <div class="text-danger d-none" id="passwordMatchError">비밀번호가 일치하지 않습니다.</div>
                <div class="text-danger d-none" id="passwordRuleError">비밀번호는 영문자, 숫자, 특수문자(@#$%^&+=!)를 포함하여 4 ~ 30자여야 합니다.</div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                <button type="button" id="savePasswordBtn" class="btn btn-primary">저장</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
