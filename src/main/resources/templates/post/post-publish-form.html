<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>publish</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CSS (optional) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Bootstrap JavaScript Bundle (Popper included) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <link th:href="@{/css/post-publish-form.css}" rel="stylesheet" />
    <link th:href="@{/css/fragment/navbar-fragment.css}" rel="stylesheet" />
</head>
<body>
<div th:replace="~{/fragment/navbar-fragment :: navbarFragment}"></div>

<div class="container-fluid mt-5">
    <div class="row">
        <div class="col-md-6">
            <form id="mainForm" method="post" th:action="@{/posts/publish}" th:object="${postPublishDto}" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="title" class="form-label">제목</label>
                    <input type="text" id="title" th:field="*{title}" class="form-control" required>
                    <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-danger"></div>
                </div>
                <div class="mb-3">
                    <label for="tag" class="form-label">태그</label>
                    <input type="text" id="tag" class="form-control">
                    <div class="tag-container" id="tag-container"></div>
                </div>
                <div>
                    <textarea id="content" th:field="*{content}" class="form-control h-100" rows="15" required></textarea>
                    <div th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="text-danger"></div>
                </div>

                <input type="file" name="thumbnail" th:field="*{thumbnail}" id="hiddenThumbnailInput" style="display:none;">

                <input type="hidden" name="userId" th:value="${#authentication.principal.getUserId()}">
                <input type="hidden" name="blogId" th:value="${#authentication.principal.getBlogId()}">

                <input type="hidden" name="isTemp" id="isTemp">
                <input type="hidden" name="isPrivate" id="isPrivate">
                <input type="hidden" name="tags" id="tags">

                <button type="button" id="tempSaveBtn" class="btn btn-secondary mt-3">임시저장</button>
                <button type="button" id="publishBtn" class="btn btn-dark mt-3" data-bs-toggle="modal" data-bs-target="#publishModal">출간하기</button>
            </form>
        </div>
        <div class="col-md-6">
            <div class="preview-pane">
                <div>
                    <h2 id="preview-title"></h2>
                </div>
                <div>
                    <br/><br/>
                    <p id="preview-content"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Publish Modal -->
<div class="modal fade" id="publishModal" tabindex="-1" aria-labelledby="publishModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="publishModalLabel">출간하기</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="row">
                    <div class="col-md-5">
                        <h4>포스트 미리보기</h4>
                        <div class="mb-3">
                            <label for="thumbnailForm" class="form-label">썸네일</label>
                            <div id="thumbnailWrapper" class="thumbnail-upload-wrapper">
                                <button type="button" id="thumbnailUploadBtn" class="btn btn-secondary">썸네일 업로드</button>
                                <input type="file" id="thumbnailForm" class="form-control">
                            </div>
                            <div class="thumbnail-actions" style="display: none;">
                                <button type="button" id="reuploadThumbnail" class="btn btn-light btn-sm">재업로드</button>
                                <button type="button" id="removeThumbnail" class="btn btn-light btn-sm">제거</button>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="contentPreview" class="form-label">포스트 내용</label>
                            <textarea id="contentPreview" class="form-control" rows="5" readonly></textarea>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <h4>공개 설정</h4>
                        <div class="mb-3">
                            <label for="visibility" class="form-label">공개 여부</label>
                            <select id="visibility" class="form-select">
                                <option value="false">공개</option>
                                <option value="true">비공개</option>
                            </select>
                        </div>
                        <h4>시리즈 설정</h4>
                        <div class="mb-3">
                            <input type="text" id="seriesInput" class="form-control" readonly>
                            <button type="button" id="seriesRegisterBtn" class="btn btn-primary mt-2">등록</button>
                        </div>
                        <div id="seriesArea" class="d-none">
                            <input type="text" id="newSeriesInput" class="form-control" placeholder="새 시리즈 추가">
                            <div id="newSeriesActions" class="mt-2 d-none">
                                <button type="button" id="cancelNewSeriesBtn" class="btn btn-secondary">취소</button>
                                <button type="button" id="addNewSeriesBtn" class="btn btn-primary">시리즈 추가</button>
                            </div>
                            <ul id="seriesList" class="list-group mt-3"></ul>
                            <div class="mt-3">
                                <button type="button" id="cancelSeriesBtn" class="btn btn-secondary">취소</button>
                                <button type="button" id="selectSeriesBtn" class="btn btn-primary">선택하기</button>
                            </div>
                        </div>
                    </div>
                </div>
                <button type="button" id="modalPublishBtn" class="btn btn-dark">출간하기</button>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const tagInput = document.getElementById('tag');
        const tagContainer = document.getElementById('tag-container');
        const tags = [];
        let isComposing = false;

        tagInput.addEventListener('compositionstart', function () {
            isComposing = true;
        });

        tagInput.addEventListener('compositionend', function () {
            isComposing = false;
        });

        tagInput.addEventListener('keydown', function (e) {
            if (!isComposing && (e.key === 'Enter' || e.key === ',')) {
                e.preventDefault();
                const tagValue = tagInput.value.trim();
                if (tagValue) {
                    addTag(tagValue);
                    tagInput.value = '';
                }
            }
        });

        function addTag(tag) {
            if (tag && !tags.includes(tag)) {
                tags.push(tag);
                updateTagsInput();

                const tagBtn = document.createElement('button');
                tagBtn.type = 'button';
                tagBtn.className = 'btn tag-btn btn-outline-dark position-relative me-1 mb-1';
                tagBtn.textContent = tag;

                tagBtn.addEventListener('click', function () {
                    removeTag(tag);
                    tagContainer.removeChild(tagBtn);
                });
                tagContainer.appendChild(tagBtn);
            }
        }

        function removeTag(tag) {
            const index = tags.indexOf(tag);
            if (index > -1) {
                tags.splice(index, 1);
                updateTagsInput();
            }
        }

        function updateTagsInput() {
            document.getElementById('tags').value = tags.join(',');
        }

        document.getElementById('tempSaveBtn').addEventListener('click', function () {
            document.getElementById('isTemp').value = true;
            document.getElementById('isPrivate').value = true;
            document.getElementById('mainForm').submit();
        });

        document.getElementById('publishBtn').addEventListener('click', function () {
            document.getElementById('isTemp').value = false;
        });

        // 실시간 미리보기 기능 추가
        const titleInput = document.getElementById('title');
        const contentInput = document.getElementById('content');
        const previewTitle = document.getElementById('preview-title');
        const previewContent = document.getElementById('preview-content');

        titleInput.addEventListener('input', function () {
            previewTitle.textContent = titleInput.value;
        });

        contentInput.addEventListener('input', function () {
            previewContent.textContent = contentInput.value;
        });

        // 썸네일 업로드 처리
        const thumbnailForm = document.getElementById('thumbnailForm');
        const thumbnailWrapper = document.getElementById('thumbnailWrapper');
        const thumbnailActions = document.querySelector('.thumbnail-actions');

        function resetThumbnailButton() {
            thumbnailWrapper.innerHTML = `<button type="button" id="thumbnailUploadBtn" class="btn btn-secondary">썸네일 업로드</button>`;
            thumbnailActions.style.display = 'none';
            thumbnailForm.value = '';
            document.getElementById('thumbnailUploadBtn').addEventListener('click', function () {
                thumbnailForm.click();
            });
        }

        document.getElementById('thumbnailUploadBtn').addEventListener('click', function () {
            thumbnailForm.click();
        });

        thumbnailForm.addEventListener('change', function () {
            if (thumbnailForm.files && thumbnailForm.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    thumbnailWrapper.innerHTML = `<img src="${e.target.result}" alt="썸네일" style="width: 100%; height: 100%; object-fit: cover;">`;
                    thumbnailActions.style.display = 'block';
                };
                reader.readAsDataURL(thumbnailForm.files[0]);
            }
        });

        document.getElementById('reuploadThumbnail').addEventListener('click', function () {
            thumbnailForm.click();
        });

        document.getElementById('removeThumbnail').addEventListener('click', function () {
            resetThumbnailButton();
        });

        // 모달창의 출간하기 버튼 클릭 시 모달 데이터 메인 폼으로 복사 후 제출
        document.getElementById('modalPublishBtn').addEventListener('click', function () {
            const visibility = document.getElementById('visibility').value;

            document.getElementById('isPrivate').value = visibility === 'true';

            document.getElementById('mainForm').submit();
        });

        // 시리즈 설정 처리
        const seriesInput = document.getElementById('seriesInput');
        const seriesRegisterBtn = document.getElementById('seriesRegisterBtn');
        const seriesArea = document.getElementById('seriesArea');
        const seriesList = document.getElementById('seriesList');
        const newSeriesInput = document.getElementById('newSeriesInput');
        const newSeriesActions = document.getElementById('newSeriesActions');
        const cancelNewSeriesBtn = document.getElementById('cancelNewSeriesBtn');
        const addNewSeriesBtn = document.getElementById('addNewSeriesBtn');
        const cancelSeriesBtn = document.getElementById('cancelSeriesBtn');
        const selectSeriesBtn = document.getElementById('selectSeriesBtn');

        seriesRegisterBtn.addEventListener('click', function () {
            const blogId = document.querySelector('[name="blogId"]').value;

            // Fetch series data from server
            fetch(`http://localhost:8080/series/${blogId}/all`)
                .then(response => response.json())
                .then(data => {
                    seriesList.innerHTML = ''; // Clear any existing list items

                    data.forEach(series => {
                        const listItem = document.createElement('li');
                        listItem.className = 'list-group-item';

                        const seriesRadio = document.createElement('input');
                        seriesRadio.type = 'radio';
                        seriesRadio.name = 'series';
                        seriesRadio.value = series.name;

                        listItem.appendChild(seriesRadio);
                        listItem.appendChild(document.createTextNode(series.name));
                        seriesList.appendChild(listItem);
                    });

                    seriesArea.classList.remove('d-none'); // Show series area
                });
        });

        newSeriesInput.addEventListener('input', function () {
            if (newSeriesInput.value) {
                newSeriesActions.classList.remove('d-none');
            } else {
                newSeriesActions.classList.add('d-none');
            }
        });

        addNewSeriesBtn.addEventListener('click', function () {
            const blogId = document.querySelector('[name="blogId"]').value;

            fetch(`http://localhost:8080/series/register`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name: newSeriesInput.value, blogId: blogId })
            })
                .then(response => response.json())
                .then(newSeries => {
                    const newListItem = document.createElement('li');
                    newListItem.className = 'list-group-item';

                    const newSeriesRadio = document.createElement('input');
                    newSeriesRadio.type = 'radio';
                    newSeriesRadio.name = 'series';
                    newSeriesRadio.value = newSeries.name;

                    newListItem.appendChild(newSeriesRadio);
                    newListItem.appendChild(document.createTextNode(newSeries.name));
                    seriesList.appendChild(newListItem);

                    newSeriesInput.value = '';
                    newSeriesActions.classList.add('d-none');
                });
        });

        cancelNewSeriesBtn.addEventListener('click', function () {
            newSeriesInput.value = '';
            newSeriesActions.classList.add('d-none');
        });

        cancelSeriesBtn.addEventListener('click', function () {
            seriesArea.classList.add('d-none');
        });

        selectSeriesBtn.addEventListener('click', function () {
            const selectedSeries = document.querySelector('input[name="series"]:checked');
            if (selectedSeries) {
                seriesInput.value = selectedSeries.value;
                seriesArea.classList.add('d-none');
            }
        });
    });
</script>

</body>
</html>
