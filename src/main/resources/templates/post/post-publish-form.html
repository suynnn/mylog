<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>publish</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CSS (optional) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Bootstrap JavaScript Bundle (Popper included) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <link th:href="@{/css/post-publish-form.css}" rel="stylesheet" />
    <link th:href="@{/css/fragment/navbar-fragment.css}" rel="stylesheet" />
</head>
<body>
<div th:replace="~{/fragment/navbar-fragment :: navbarFragment}"></div>

<div>
    <form method="post" th:action="@{/posts/publish}" th:object="${postPublishDto}">

        <input type="hidden" name="userId", th:value="${#authentication.principal.getUserId()}">
        <input type="hidden" name="blogId", th:value="${#authentication.principal.getBlogId()}">
        <button type="submit">등록</button>
    </form>
</div>

</body>
</html>
