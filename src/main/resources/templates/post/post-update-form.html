<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CSS (optional) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Bootstrap JavaScript Bundle (Popper included) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <link th:href="@{/css/post-update-form.css}" rel="stylesheet" />
  <link th:href="@{/css/fragment/navbar-fragment.css}" rel="stylesheet" />

  <script th:src="@{/js/post-update-form.js}"></script>
</head>
<body>
<div th:replace="~{/fragment/navbar-fragment :: navbarFragment}"></div>

<div class="container-fluid mt-5">
    <div class="row">
        <div class="col-md-6">
            <form id="mainForm" method="post" th:action="@{'/posts/update/' + ${postId}}" th:object="${postPublishDto}" enctype="multipart/form-data">
                <div class="mb-3">
                    <label for="title" class="form-label">제목</label>
                    <input type="text" id="title" th:field="*{title}" class="form-control" required>
                    <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-danger"></div>
                </div>
                <div class="mb-3">
                    <label for="tag" class="form-label">태그</label>
                    <input type="text" id="tag" class="form-control" th:value="${postPublishDto.tags}">
                    <div class="tag-container" id="tag-container"></div>
                </div>
                <div>
                    <textarea id="content" th:field="*{content}" class="form-control h-100" rows="15" required></textarea>
                    <div th:if="${#fields.hasErrors('content')}" th:errors="*{content}" class="text-danger"></div>
                </div>

                <input type="file" name="thumbnail" th:field="*{thumbnail}" id="hiddenThumbnailInput" style="display:none;">

                <input type="hidden" name="userId" th:value="${#authentication.principal.getUserId()}">
                <input type="hidden" name="blogId" th:value="${#authentication.principal.getBlogId()}">

                <input type="hidden" name="isTemp" id="isTemp">
                <input type="hidden" name="isPrivate" id="isPrivate">

                <input type="hidden" name="tags" id="tags" th:value="${postPublishDto.tags}">
                <input type="hidden" name="seriesId" id="seriesId">

                <button type="button" id="tempSaveBtn" class="btn btn-secondary mt-3">임시저장</button>
                <button type="button" id="publishBtn" class="btn btn-dark mt-3" data-bs-toggle="modal" data-bs-target="#publishModal">출간하기</button>
            </form>
        </div>
        <div class="col-md-6">
            <div class="preview-pane">
                <div>
                    <h2 id="preview-title"></h2>
                </div>
                <div>
                    <br/><br/>
                    <p id="preview-content"></p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Publish Modal -->
<div class="modal fade" id="publishModal" tabindex="-1" aria-labelledby="publishModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="publishModalLabel">출간하기</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body d-flex">
                <div class="col-md-5 h-100">
                    <h4>포스트 미리보기</h4>
                    <div class="mb-3">
                        <label for="thumbnailForm" class="form-label">썸네일</label>
                        <div id="thumbnailWrapper" class="thumbnail-upload-wrapper">
                            <button type="button" id="thumbnailUploadBtn" class="btn btn-secondary">썸네일 업로드</button>
                            <input type="file" id="thumbnailForm" class="form-control">
                        </div>
                        <div class="thumbnail-actions" style="display: none;">
                            <button type="button" id="reuploadThumbnail" class="btn btn-light btn-sm">재업로드</button>
                            <button type="button" id="removeThumbnail" class="btn btn-light btn-sm">제거</button>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="contentPreview" class="form-label">포스트 내용</label>
                        <textarea id="contentPreview" class="form-control h-100" rows="5" readonly></textarea>
                    </div>
                </div>
                <div class="col-md-6 h-100 ms-3">
                    <h4>공개 설정</h4>
                    <div class="mb-3">
                        <label for="visibility" class="form-label">공개 여부</label>
                        <select id="visibility" class="form-select">
                            <option value="false">공개</option>
                            <option value="true">비공개</option>
                        </select>
                    </div>
                    <h4>시리즈 설정</h4>
                    <div class="mb-3">
                        <input type="text" id="seriesInput" class="form-control" readonly>
                        <button type="button" id="seriesRegisterBtn" class="btn btn-primary mt-2">등록</button>
                    </div>
                    <div id="seriesArea" class="d-none">
                        <input type="text" id="newSeriesInput" class="form-control" placeholder="새 시리즈 추가">
                        <div id="newSeriesActions" class="mt-2 d-none">
                            <button type="button" id="cancelNewSeriesBtn" class="btn btn-secondary">취소</button>
                            <button type="button" id="addNewSeriesBtn" class="btn btn-primary">시리즈 추가</button>
                        </div>
                        <ul id="seriesList" class="list-group mt-3"></ul>
                        <div class="mt-3">
                            <button type="button" id="cancelSeriesBtn" class="btn btn-secondary">취소</button>
                            <button type="button" id="selectSeriesBtn" class="btn btn-primary">선택하기</button>
                        </div>
                    </div>
                    <div class="mt-3 d-flex justify-content-between">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                        <button type="button" id="modalPublishBtn" class="btn btn-dark">출간하기</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
