<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>post</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CSS (optional) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <link th:href="@{/css/fragment/navbar-fragment.css}" rel="stylesheet" />
    <link th:href="@{/css/post.css}" rel="stylesheet" />

    <script th:src="@{/js/post.js}"></script>

</head>
<body>
    <div th:replace="~{/fragment/navbar-fragment :: navbarFragment}"></div>

    <div class="container mt-5">
        <main>
            <div class="mb-4">
                <h1 th:text="${postDto.title}"></h1>
                <div class="post-info">
                    <span th:text="${postDto.user.username}"></span> •
                    <span th:text="${postDto.updatedAt != null ? postDto.updatedAt : postDto.createdAt}"></span>
                </div>
            </div>
            <div class="post-tags">
                <button th:each="tag : ${postDto.postTags}" type="button" class="btn btn-outline-secondary btn-sm" th:text="${tag.tag.name}"></button>
            </div>
            <div class="post-series" th:if="${postDto.series != null}">
                <span th:text="${postDto.series.name}"></span>
            </div>
            <div class="post-thumbnail" th:if="${postDto.thumbnailUrl != '/upload/null'}">
                <img th:src="${postDto.thumbnailUrl}" alt="Thumbnail">
            </div>
            <div class="post-content">
                <p th:utext="${postDto.content}"></p>
            </div>
        </main>

        <div class="comment">

        </div>
    </div>
</body>
</html>
