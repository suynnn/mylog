<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CSS (optional) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Bootstrap JavaScript Bundle (Popper included) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <link th:href="@{/css/fragment/navbar-fragment.css}" rel="stylesheet" />
    <link th:href="@{/css/post-temp-list.css}" rel="stylesheet" />

    <script th:src="@{/js/post-temp-list.js}"></script>
</head>
<body>
<div th:replace="~{/fragment/navbar-fragment :: navbarFragment}"></div>

<div class="container my-5">
    <main>
        <div>
            <ul class="row" id="post-list">
                <li th:each="post : ${postDtoList}" class="col-md-3 mb-4" th:data-id="${post.id}" th:data-username="${post.user.username}">
                    <div class="card post-card">
                        <div th:if="${post.thumbnailUrl != '/upload/null'}" class="thumbnail-container">
                            <img th:src="${post.thumbnailUrl}" class="card-img-top" alt="Thumbnail">
                        </div>
                        <div class="card-body post-card-content">
                            <h5 class="card-title" th:text="${post.title}"></h5>
                            <p class="card-text">
                                <span th:if="${post.content.length() > 150}" th:text="${post.content.substring(0, 150)} + '...'"></span>
                                <span th:if="${post.content.length() <= 150}" th:text="${post.content}"></span>
                            </p>
                            <div class="text-muted">
                                <small th:text="${post.createdAt}"></small>
                                <!-- <small th:text="'댓글 ' + ${post.comments.size()} + '개'"></small> -->
                            </div>
                        </div>
                        <div class="card-footer post-card-footer">
                            <div>
                                <small th:text="${post.user.username}"></small>
                                <small th:text="'좋아요 ' + ${post.likes.size()}"></small>
                            </div>
                        </div>
                    </div>
                </li>
            </ul>
        </div>
    </main>
</div>
</body>
</html>
