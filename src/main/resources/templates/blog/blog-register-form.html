<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>블로그 개설</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CSS (optional) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <link th:href="@{/css/fragment/navbar-fragment.css}" rel="stylesheet" />
  <link th:href="@{/css/blog-register-form.css}" rel="stylesheet" />
</head>
<body>
<div th:replace="~{fragment/navbar-fragment :: navbarFragment}"></div>

<div>
  <div class="container">
    <h1>블로그 개설</h1>
    <div class="row justify-content-center">
      <div class="col-lg-6 form-container">
        <form method="post" th:action="@{/blogs/register}" th:object="${blogMakeDto}" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="title" class="form-label">제목</label>
            <input type="text" id="title" th:field="*{title}" class="form-control" required>
            <div th:if="${#fields.hasErrors('title')}" th:errors="*{title}" class="text-danger"></div>
          </div>
          <div class="mb-3">
            <label for="intro" class="form-label">한 줄 소개</label>
            <input type="text" id="intro" th:field="*{intro}" class="form-control">
            <div th:if="${#fields.hasErrors('intro')}" th:errors="*{intro}" class="text-danger"></div>
          </div>
          <div class="mb-3">
            <label for="profileImg" class="form-label">프로필 등록</label>
            <div class="d-flex align-items-center">
              <div id="profileImgPreviewContainer" class="me-3">
                <img id="profileImgPreview" src="#" alt="프로필 이미지 미리보기" style="display: none;">
              </div>
              <div class="file-input-container me-3">
                <input type="file" id="profileImg" th:field="*{profileImg}" class="form-control" onchange="previewImage(event)">
              </div>
              <button type="button" class="btn btn-danger btn-sm" onclick="clearImage()">지우기</button>
            </div>
            <div th:if="${#fields.hasErrors('profileImg')}" th:errors="*{profileImg}" class="text-danger"></div>
          </div>
          <h3>소셜 정보</h3>
          <div class="mb-3">
            <label for="email" class="form-label">이메일</label>
            <input type="text" id="email" th:field="*{email}" class="form-control">
            <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></div>
          </div>
          <div class="mb-3">
            <label for="github" class="form-label">깃허브</label>
            <input type="text" id="github" th:field="*{github}" class="form-control">
            <div th:if="${#fields.hasErrors('github')}" th:errors="*{github}" class="text-danger"></div>
          </div>

          <input type="hidden" name="username" th:value="${#authentication.name}">
          <button type="submit" class="btn btn-primary w-100">등록하기</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  function previewImage(event) {
    let reader = new FileReader();
    reader.onload = function() {
      let output = document.getElementById('profileImgPreview');
      output.src = reader.result;
      output.style.display = 'block';
    }
    reader.readAsDataURL(event.target.files[0]);
  }

  function clearImage() {
    let fileInput = document.getElementById('profileImg');
    let preview = document.getElementById('profileImgPreview');

    fileInput.value = ''; // 파일 입력 초기화
    preview.src = '#'; // 미리보기 이미지 초기화
    preview.style.display = 'none'; // 미리보기 숨기기
  }
</script>

</body>
</html>
