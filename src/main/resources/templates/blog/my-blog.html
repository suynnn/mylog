<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 블로그</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CSS (optional) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <link th:href="@{/css/fragment/navbar-fragment.css}" rel="stylesheet" />
    <link th:href="@{/css/my-blog.css}" rel="stylesheet" />

</head>
<body>
<div th:replace="~{/fragment/navbar-fragment :: blogNarbarFlagment}"></div>

<main class="main-style container">
    <div class="row justify-content-center">
        <div class="col-md-9">
            <div class="profile-section">
                <div class="profile-image">
                    <a href="/@typo">
                        <img class="rounded-circle mb-3" width="128" height="128" th:src="${blogInfoDto.profileImg}" alt="profile" />
                    </a>
                </div>
                <div class="profile-info">
                    <h2><span th:text="${blogInfoDto.user.nickname}" /></h2>
                    <div class="text-muted">
                        <!-- UserProfile_description__ifY8l -->
                    </div>
                    <div class="follow-section">
                        <a href="/@typo/followers">
                            <span>0</span>
                            <span>팔로워</span>
                        </a>
                        <a href="/@typo/followings">
                            <span>0</span>
                            <span>팔로잉</span>
                        </a>
                    </div>
                    <div class="follow-section btn-section">
                        <button>팔로우</button>
                    </div>
                </div>
            </div>

            <ul class="nav nav-tabs" id="nav-tab" role="tablist">
                <li class="nav-item">
                    <a class="nav-link active" id="nav-posts-tab" data-toggle="tab" href="#nav-posts" role="tab" aria-controls="nav-posts" aria-selected="true">글</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="nav-series-tab" data-toggle="tab" href="#nav-series" role="tab" aria-controls="nav-series" aria-selected="false">시리즈</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" id="nav-about-tab" data-toggle="tab" href="#nav-about" role="tab" aria-controls="nav-about" aria-selected="false">소개</a>
                </li>
            </ul>

            <div class="tab-content mt-3" id="nav-tabContent">
                <div class="tab-pane fade show active" id="nav-posts" role="tabpanel" aria-labelledby="nav-posts-tab">
                    <!-- VelogPosts_block__nfCQF -->
                    <!-- 여기에 포스트 리스트 등의 내용이 들어갑니다 -->
                </div>
                <div class="tab-pane fade" id="nav-series" role="tabpanel" aria-labelledby="nav-series-tab">
                    <!-- 시리즈 내용 -->
                </div>
                <div class="tab-pane fade" id="nav-about" role="tabpanel" aria-labelledby="nav-about-tab">
                    <!-- 소개 내용 -->
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
