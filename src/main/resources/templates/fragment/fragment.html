<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CSS (optional) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Bootstrap JavaScript Bundle (Popper included) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
<div th:fragment="navbarFragment">
    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">mylog</a>
            <div class="navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-bell"></i></a>
                    </li>
                    <li class="nav-item">
                        <div sec:authorize="isAnonymous()">
                            <button class="btn btn-dark" th:onclick="|location.href='@{/login-form}'|">로그인</button>
                        </div>
                        <div sec:authorize="isAuthenticated()" class="button-icon-container">
                            <button class="btn btn-outline-dark" th:onclick="|location.href='@{/}'|">새 글 작성</button>
                            <div class="dropdown">
                                <a class="nav-link dropdown-toggle" href="#" id="userMenu" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                                    <i class="bi bi-person"></i>
                                </a>
                                <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userMenu">
                                    <li><a class="dropdown-item" href="#">내 블로그</a></li>
                                    <li><a class="dropdown-item" href="#">임시 글</a></li>
                                    <li><a class="dropdown-item" href="#">읽기 목록</a></li>
                                    <li><a class="dropdown-item" href="#">설정</a></li>
                                    <li><hr class="dropdown-divider"></li>
                                    <li><a class="dropdown-item" th:href="@{/logout}">로그아웃</a></li>
                                </ul>
                            </div>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', (event) => {
            let lastScrollTop = 0;
            window.addEventListener('scroll', () => {
                let st = window.pageYOffset || document.documentElement.scrollTop;
                const navbar = document.querySelector('.navbar');
                if (st > lastScrollTop) {
                    // downscroll code
                    navbar.classList.add('navbar-hidden');
                } else {
                    // upscroll code
                    navbar.classList.remove('navbar-hidden');
                }
                lastScrollTop = st <= 0 ? 0 : st; // For Mobile or negative scrolling
            });
        });
    </script>
</div>

</body>
</html>
