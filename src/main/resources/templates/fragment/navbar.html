<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="https://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CSS (optional) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Bootstrap JavaScript Bundle (Popper included) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
<div th:fragment="navbarFragment">
    <!-- Header -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">mylog</a>
            <div class="navbar-collapse" id="navbarContent">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-bell"></i></a>
                    </li>
                    <li class="nav-item">
                        <div sec:authorize="isAnonymous()">
                            <button class="btn btn-dark" th:onclick="|location.href='@{/login-form}'|">로그인</button>
                        </div>
                        <div sec:authorize="isAuthenticated()" class="button-icon-container">
                            <button class="btn btn-outline-dark" th:onclick="|location.href='@{/}'|">새 글 작성</button>
                            <a class="nav-link" href="#"><i class="bi bi-person"></i></a>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
</div>


</body>
</html>
