<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CSS (optional) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Bootstrap JavaScript Bundle (Popper included) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <link th:href="@{/css/fragment/navbar-fragment.css}" rel="stylesheet" />
    <link th:href="@{/css/login-form.css}" rel="stylesheet" />

    <script th:inline="javascript">
        let loginError = [[${loginError != null ? '"' + loginError + '"' : 'null'}]];
    </script>

    <script th:src="@{/js/login-form.js}"></script>
</head>
<body>
<div th:replace="~{/fragment/navbar-fragment :: navbarFragment}"></div>

<div>
    <div class="container mt-5">
        <h1 class="text-center">로그인</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <form method="post" th:action="@{/login}">
                    <div class="mb-3">
                        <label for="username" class="form-label">아이디</label>
                        <input type="text" id="username" name="username" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">패스워드</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="login-btn btn btn-primary w-100">로그인</button>
                </form>
                <div class="additional-info">
                    <p>아직 회원이 아니신가요? <a th:href="@{/users/register}">회원가입</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
